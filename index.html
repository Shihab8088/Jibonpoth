<!doctype html><html lang=bn><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0d1015><link rel=manifest href=manifest.webmanifest><style>*{box-sizing:border-box}body{margin:0;background:#0d1015;color:#f5f6f8;font-family:"Noto Sans Bengali",system-ui,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:80px}header{height:70px;padding:12px 17px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;background:#0d1015ee;backdrop-filter:blur(15px);border-bottom:1px solid #262d37}.brand b,.brand small{display:block}.brand small{color:#8f98a5;font-size:10px}header button,.rhead button{width:40px;height:40px;border-radius:12px;border:1px solid #303743;background:#171b22;color:#fff;font-size:20px}.hero{margin:18px;border-radius:24px;padding:26px 22px;background:linear-gradient(145deg,#202a38,#14171c);border:1px solid #303947}.hero em,.rhead em{font-size:10px;color:#e2b55d;font-weight:900;letter-spacing:.1em}.hero h1{font-size:29px;line-height:1.2}.hero span{color:#ffb0a5}.hero p{color:#aab2be;font-size:13px;line-height:1.7}.primary,.save{border:0;border-radius:12px;padding:11px 15px;background:#f1b7af;color:#15171a;font-family:inherit;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 18px 20px;background:#15191f;border:1px solid #292f38;border-radius:17px}.stats div{text-align:center;padding:13px;border-right:1px solid #292f38}.stats div:last-child{border:0}.stats b,.stats small{display:block}.stats small{color:#89929e;font-size:10px}section{padding:0 18px;margin-top:18px}section h1{font-size:24px}section h2{font-size:16px}.card{display:flex;align-items:center;gap:11px;margin:9px 0;padding:11px;border:1px solid #29313c;background:#15191f;border-radius:16px;cursor:pointer}.card i{font-style:normal;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#232a34;color:#e4b75e;font-weight:900}.card div{flex:1;min-width:0}.card b,.card small,.card p{display:block}.card small{font-size:9px;color:#89929e}.card p{font-size:10px;color:#838c99;margin:4px 0}.card strong{color:#d9ad59;font-size:18px}.wide{width:100%;padding:11px;border:1px solid #303743;background:#171b22;color:#fff;border-radius:12px;font-family:inherit}.search{display:flex;gap:8px;align-items:center;background:#15191f;border:1px solid #2b323c;border-radius:13px;padding:0 12px}.search input{flex:1;padding:12px;border:0;outline:0;background:none;color:#fff;font-family:inherit}.progress{padding:22px;background:#171c24;border:1px solid #303744;border-radius:18px;text-align:center}.progress>b{font-size:38px;color:#e7b961}.progress div{height:8px;background:#2a3039;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#e5b463}.progress small,.empty{color:#89929e;font-size:11px}.reader .rhead{padding:16px;display:grid;grid-template-columns:42px 1fr 42px;gap:9px}.rhead h1{font-size:21px;margin:3px 0}.rhead small{color:#89929e;font-size:10px}.paper{background:#fffdf7;color:#222;border-radius:24px 24px 0 0;padding:24px 20px;min-height:65vh}.paper h3{color:#9b263a;font-size:14px;margin:15px 0 5px}.paper h3:first-child{margin-top:0}.paper p{font-size:14px;line-height:1.9;margin:0}.paper .lesson{color:#163f79;font-weight:800}.paper textarea{width:100%;min-height:110px;padding:11px;border:1px solid #d7d0c1;border-radius:11px;font:13px "Noto Sans Bengali",sans-serif}.save{margin-top:7px;background:#263e68;color:#fff}.actions{display:flex;gap:8px;padding:12px 18px}.actions button{flex:1;padding:11px;border:1px solid #303743;background:#171b22;color:#fff;border-radius:12px;font-family:inherit}nav{position:fixed;bottom:0;left:0;right:0;height:65px;display:flex;justify-content:center;background:#11151bee;border-top:1px solid #292f38;z-index:10}nav button{flex:1;max-width:150px;background:none;border:0;color:#9aa3af;font-size:18px;font-family:inherit}nav small{display:block;font-size:9px}.light{background:#f3f4f6;color:#15181d}.light header,.light nav{background:#f3f4f6ee;border-color:#ddd}.light .hero,.light .card,.light .stats,.light .search,.light .progress,.light header button,.light .actions button{background:#fff;border-color:#ddd;color:#15181d}.light .card p,.light .card small,.light .brand small{color:#69727e}</style></head><body class=dark><div id=app></div><script>const laws=[{"id": 1, "title_bn": "উপরের মানুষটিকে কখনো অযথা ছাপিয়ে যেও না", "title_en": "Never Outshine the Master", "explanation": "নিজের যোগ্যতা দেখানো ভালো, কিন্তু এমনভাবে নয় যাতে বস, শিক্ষক বা সিনিয়র মনে করেন তুমি তাকে হুমকি দিচ্ছ। দক্ষতা + বিনয়—এই ভারসাম্যটাই গুরুত্বপূর্ণ।", "example": "বসের সামনে তার ভুল ধরার বদলে সমাধানকে তার পরিকল্পনার উন্নতি হিসেবে উপস্থাপন করা।", "lesson": "যোগ্য হও, কিন্তু অহংকার দিয়ে অন্যের মর্যাদা নষ্ট কোরো না।"}, {"id": 2, "title_bn": "বন্ধুত্ব আর স্বার্থ—দুটোকে এক করে ফেলো না", "title_en": "Never Put Too Much Trust in Friends; Learn How to Use Enemies", "explanation": "বন্ধু সবসময় সবচেয়ে নির্ভরযোগ্য কর্মসঙ্গী নাও হতে পারে; আবার প্রতিদ্বন্দ্বী কখনো কখনো নিজের অবস্থান প্রমাণ করতে বেশি মনোযোগী হয়। তাই মানুষকে সম্পর্ক দিয়ে নয়, কাজ ও চরিত্র দিয়ে বিচার করো।", "example": "বন্ধুকে শুধু বন্ধু বলেই গুরুত্বপূর্ণ দায়িত্ব না দিয়ে তার দক্ষতা যাচাই করা।", "lesson": "অবিশ্বাসী হয়ে যেও না; উদ্দেশ্য হলো মানুষকে বাস্তবভাবে বোঝা।"}, {"id": 3, "title_bn": "তোমার আসল উদ্দেশ্য সবসময় প্রকাশ কোরো না", "title_en": "Conceal Your Intentions", "explanation": "তুমি কী করতে যাচ্ছ তা আগেই সবাইকে বলে দিলে অন্যরা তোমার পরিকল্পনা নষ্ট করতে পারে। প্রয়োজন অনুযায়ী তথ্য দাও; তবে মিথ্যা তৈরি করে মানুষকে ঠকানো নয়।", "example": "চাকরি বদলের পরিকল্পনা চূড়ান্ত হওয়ার আগে অপ্রয়োজনীয় সবার কাছে না বলা।", "lesson": "গোপনীয়তা মানে প্রতারণা নয়; প্রয়োজনের চেয়ে বেশি তথ্য না দেওয়া।"}, {"id": 4, "title_bn": "প্রয়োজনের চেয়ে কম কথা বলো", "title_en": "Always Say Less Than Necessary", "explanation": "বেশি কথা বললে ভুল, দুর্বলতা বা অপ্রয়োজনীয় তথ্য বেরিয়ে যায়। সংক্ষিপ্ত ও পরিষ্কার কথা অনেক সময় বেশি আত্মবিশ্বাসী শোনায়।", "example": "কেউ প্রশ্ন করলে দীর্ঘ গল্প না করে সরাসরি প্রয়োজনীয় উত্তর দেওয়া।", "lesson": "চুপ থাকা যেন অহংকার বা অসহযোগিতা না হয়।"}, {"id": 5, "title_bn": "সুনামকে খুব গুরুত্ব দাও", "title_en": "So Much Depends on Reputation—Guard It with Your Life", "explanation": "মানুষ তোমাকে কীভাবে দেখে, তা সুযোগ ও বিশ্বাসে বড় প্রভাব ফেলে। তাই কথাবার্তা, কাজ ও অনলাইন আচরণে ধারাবাহিক থাকো।", "example": "একবার ভুল হলে অজুহাত না দিয়ে দ্রুত স্বীকার ও সংশোধন করা।", "lesson": "সুনাম রক্ষা মানে ভুল লুকানো নয়; বরং বিশ্বাসযোগ্য থাকা।"}, {"id": 6, "title_bn": "মনোযোগ আকর্ষণের গুরুত্ব বোঝো", "title_en": "Court Attention at All Cost", "explanation": "মানুষ সাধারণত যা চোখে পড়ে সেটাই মনে রাখে। তাই কাজ, উপস্থাপন বা ব্যক্তিত্বকে এমনভাবে সাজাও যাতে তোমার ভালো কাজ হারিয়ে না যায়।", "example": "ভালো প্রজেক্ট করলে পরিষ্কার ফলাফলসহ তা উপস্থাপন করা।", "lesson": "নেতিবাচক প্রচার করে জনপ্রিয় হওয়ার চেষ্টা বিপজ্জনক।"}, {"id": 7, "title_bn": "সহযোগিতা ব্যবহার করো—কিন্তু কৃতিত্বে ন্যায্য থাকো", "title_en": "Get Others to Do the Work for You, but Always Take the Credit", "explanation": "বড় কাজ একা না করে দক্ষ মানুষের সহযোগিতা নেওয়া বুদ্ধিমানের কাজ। তবে অন্যের কাজ নিজের নামে চালিয়ে দেওয়া অনৈতিক; প্রকৃত অবদান স্বীকার করাই দীর্ঘমেয়াদে শক্তি।", "example": "একটি টিম প্রজেক্টে যে যার কাজ ভাগ করে নেওয়া এবং শেষে সবার অবদান উল্লেখ করা।", "lesson": "বইয়ের এই Law-এর ম্যানিপুলেটিভ অংশ নয়, কার্যকর delegation-টাই শেখো।"}, {"id": 8, "title_bn": "সবসময় তুমি দৌড়ে যেও না; সুযোগ তৈরি করো", "title_en": "Make Other People Come to You—Use Bait if Necessary", "explanation": "যেখানে সম্ভব, এমন মূল্য তৈরি করো যাতে মানুষ নিজেই তোমার কাছে আসে। নিজের সময় ও অবস্থানকে সম্মান করাও দরকার।", "example": "একজন ফ্রিল্যান্সার নিজের কাজের নমুনা ও পরিষ্কার অফার তৈরি করে ক্লায়েন্টকে আগ্রহী করা।", "lesson": "প্রলোভন দিয়ে প্রতারণা নয়; সত্যিকারের মূল্য দিয়ে আকর্ষণ তৈরি করো।"}, {"id": 9, "title_bn": "তর্কের বদলে ফলাফল দিয়ে প্রমাণ করো", "title_en": "Win Through Your Actions, Never Through Argument", "explanation": "শুধু কথা বলে কাউকে হারানো সাময়িক। বাস্তব ফলাফল দেখাতে পারলে বিরোধ অনেক সময় নিজেই শেষ হয়ে যায়।", "example": "কেউ বলল তুমি সময়মতো কাজ পারবে না—তর্ক না করে সময়মতো কাজ জমা দেওয়া।", "lesson": "সব তর্ক এড়িয়ে যাওয়া নয়; প্রয়োজন হলে তথ্যভিত্তিক আলোচনা করো।"}, {"id": 10, "title_bn": "অতিরিক্ত নেতিবাচকতার প্রভাব থেকে নিজেকে বাঁচাও", "title_en": "Infection: Avoid the Unhappy and Unlucky", "explanation": "মানুষের আবেগ ও অভ্যাস ছড়িয়ে পড়ে। সবসময় অভিযোগ, হতাশা বা বিশৃঙ্খলায় থাকা মানুষের প্রভাব নিজের উপর পড়তে পারে।", "example": "বন্ধু সমস্যায় থাকলে সাহায্য করা, কিন্তু তার সব নেতিবাচক অভ্যাস নিজের জীবনে নেওয়া নয়।", "lesson": "কষ্টে থাকা মানুষকে ঘৃণা নয়—নিজের সীমা ও মানসিক স্থিরতা রক্ষা।"}, {"id": 11, "title_bn": "তোমার মূল্য এমন করো যাতে মানুষ তোমাকে প্রয়োজন মনে করে", "title_en": "Learn to Keep People Dependent on You", "explanation": "দক্ষতা, নির্ভরযোগ্যতা ও বিশেষ জ্ঞান তৈরি করলে তোমার কাজের মূল্য বাড়ে। উদ্দেশ্য অন্যকে আটকে রাখা নয়; নিজের দক্ষতাকে শক্তিশালী করা।", "example": "একজন কর্মী এমন একটি দক্ষতা শেখে যা টিমে গুরুত্বপূর্ণ, এবং সেই জ্ঞান অন্যদেরও শেখায়।", "lesson": "জ্ঞান ইচ্ছাকৃতভাবে লুকিয়ে dependency তৈরি করা দীর্ঘমেয়াদে ক্ষতিকর।"}, {"id": 12, "title_bn": "সততা ও উদারতা বেছে ব্যবহার করো", "title_en": "Use Selective Honesty and Generosity to Disarm Your Victim", "explanation": "একটি সত্য কথা বা ছোট উপকার মানুষের প্রতিরোধ কমাতে পারে। কিন্তু এটাকে কারও দুর্বলতা কাজে লাগানোর অস্ত্র বানানো ঠিক নয়।", "example": "আলোচনার শুরুতে নিজের একটি সত্যিকারের সীমাবদ্ধতা স্বীকার করে বিশ্বাস তৈরি করা।", "lesson": "উপকারের আড়ালে গোপন ফাঁদ পাতা এড়িয়ে চলো।"}, {"id": 13, "title_bn": "সাহায্য চাইলে পারস্পরিক লাভ দেখাও", "title_en": "When Asking for Help, Appeal to People’s Self-Interest", "explanation": "মানুষ সাধারণত তখন বেশি আগ্রহী হয় যখন কাজটিতে তারও কোনো লাভ, শেখা বা মূল্য থাকে। শুধু দয়া চেয়ে নয়, পরিষ্কারভাবে mutual benefit বোঝাও।", "example": "সহকর্মীকে সাহায্য চাইতে বলা—‘তুমি এটা করলে তোমারও প্রজেক্টে অভিজ্ঞতা হবে।’", "lesson": "মানুষের দুর্বলতা শোষণ নয়; ন্যায্য বিনিময় তৈরি করো।"}, {"id": 14, "title_bn": "শুনতে শেখো এবং তথ্য বুঝে নাও", "title_en": "Pose as a Friend, Work as a Spy", "explanation": "মানুষ কী বলছে, কী করছে এবং কী চায়—এসব পর্যবেক্ষণ করা সামাজিক বুদ্ধিমত্তার অংশ। গোপনে ক্ষতি করার জন্য গুপ্তচরবৃত্তি নয়; তথ্য যাচাইয়ের দক্ষতা শেখাই নিরাপদ প্রয়োগ।", "example": "মিটিংয়ে কথা বলার পাশাপাশি সবার প্রয়োজন ও উদ্বেগ নোট করা।", "lesson": "ব্যক্তিগত গোপনীয়তা লঙ্ঘন কোরো না।"}, {"id": 15, "title_bn": "দীর্ঘমেয়াদি সংঘাত অর্ধেক রেখে যেও না", "title_en": "Crush Your Enemy Totally", "explanation": "বইটি শত্রুকে পুরোপুরি ধ্বংস করার কঠোর কৌশল বললেও বাস্তবে এর নিরাপদ শিক্ষা হলো—সমস্যার মূল কারণ সমাধান করো, যেন একই দ্বন্দ্ব বারবার না ফিরে আসে।", "example": "কর্মক্ষেত্রে ভুলের জন্য কাউকে অপমান না করে প্রক্রিয়ার দুর্বলতা ঠিক করা।", "lesson": "প্রতিশোধ নয়; conflict resolution ও boundary-setting বেছে নাও।"}, {"id": 16, "title_bn": "অতিরিক্ত উপস্থিতি মূল্য কমাতে পারে", "title_en": "Use Absence to Increase Respect and Honor", "explanation": "সবসময় হাতের কাছে থাকলে মানুষ তোমাকে স্বাভাবিক ধরে নিতে পারে। নিজের সময়, সীমা ও ব্যক্তিগত জায়গা বজায় রাখলে উপস্থিতির মূল্য বাড়ে।", "example": "প্রতিদিন সারাক্ষণ মেসেজে না থেকে নির্দিষ্ট সময়ে যোগাযোগ করা।", "lesson": "ইচ্ছা করে মানুষকে শাস্তি দিতে গায়েব হওয়া ঠিক নয়।"}, {"id": 17, "title_bn": "সবসময় একই প্রতিক্রিয়া দেখানো জরুরি নয়", "title_en": "Keep Others in Suspended Terror: Cultivate an Air of Unpredictability", "explanation": "Lawটির চরম সংস্করণ ভয় ও অনিশ্চয়তা তৈরির কথা বলে। নিরাপদ শিক্ষা হলো—নিজেকে এত predictable কোরো না যে সবাই তোমার সীমা পরীক্ষা করতে পারে; তবে অকারণে ভয় সৃষ্টি কোরো না।", "example": "অন্যায় আচরণে কখন কীভাবে boundary দেবে, সেটা শান্তভাবে পরিস্থিতি অনুযায়ী ঠিক করা।", "lesson": "ভয় দেখানো নয়—আত্মনিয়ন্ত্রণ ও flexibility।"}, {"id": 18, "title_bn": "নিজেকে পুরোপুরি বিচ্ছিন্ন কোরো না", "title_en": "Do Not Build Fortresses to Protect Yourself—Isolation Is Dangerous", "explanation": "নিজেকে রক্ষা করতে গিয়ে সবার থেকে দূরে সরে গেলে তথ্য, সুযোগ ও সহায়তা—সব কমে যায়। সম্পর্ক ও যোগাযোগের নেটওয়ার্ক দরকার।", "example": "সমস্যা হলে একা সব সামলানোর বদলে বিশ্বস্ত মানুষের পরামর্শ নেওয়া।", "lesson": "সীমা রাখো, কিন্তু দেয়াল তুলে ফেলো না।"}, {"id": 19, "title_bn": "কার সঙ্গে কথা বলছ তা বুঝে চল", "title_en": "Know Who You’re Dealing With—Do Not Offend the Wrong Person", "explanation": "সব মানুষ একইভাবে সমালোচনা, রসিকতা বা প্রত্যাখ্যান নেয় না। ব্যক্তির স্বভাব, অবস্থান ও পরিস্থিতি বুঝে কথা বলা সামাজিক বুদ্ধিমত্তা।", "example": "রাগী ক্লায়েন্টের সামনে ব্যঙ্গ না করে শান্ত ও তথ্যভিত্তিক থাকা।", "lesson": "অতিরিক্ত ভয় নয়; সচেতনতা।"}, {"id": 20, "title_bn": "অযথা পক্ষ নেবে না", "title_en": "Do Not Commit to Anyone", "explanation": "সব বিষয়ে তাড়াহুড়ো করে পক্ষ নিলে স্বাধীন সিদ্ধান্তের জায়গা কমে যায়। নিজের মূল্যবোধ ও স্বার্থ বুঝে commitment দাও।", "example": "দুই সহকর্মীর ঝগড়ায় পুরো ঘটনা না জেনে কারও দলে না যাওয়া।", "lesson": "সৎ অবস্থান নেওয়া দরকার হলে নিরপেক্ষতার আড়ালে থেকো না।"}, {"id": 21, "title_bn": "সবসময় নিজের সব বুদ্ধি দেখানোর দরকার নেই", "title_en": "Play a Sucker to Catch a Sucker—Seem Dumber Than Your Mark", "explanation": "মানুষ কখনো নিজের শ্রেষ্ঠত্বের অনুভূতিতে বেশি কথা বলে। তাই শান্তভাবে শুনে পরিস্থিতি বোঝা কাজে লাগতে পারে।", "example": "আলোচনায় আগে অন্য পক্ষকে তার প্রয়োজন ও শর্ত ব্যাখ্যা করতে দেওয়া।", "lesson": "ইচ্ছা করে নিজেকে বোকা সাজিয়ে প্রতারণা করা নয়; active listening শেখো।"}, {"id": 22, "title_bn": "কখন পিছু হটতে হবে তা জানো", "title_en": "Use the Surrender Tactic: Transform Weakness into Power", "explanation": "সব লড়াই জেতা দরকার নেই। সাময়িকভাবে পিছিয়ে গিয়ে সময়, তথ্য বা শক্তি জোগাড় করে পরে ভালো সিদ্ধান্ত নেওয়া যায়।", "example": "ঝগড়া বাড়ছে বুঝে কথোপকথন থামিয়ে পরে শান্তভাবে আলোচনা করা।", "lesson": "সম্মান রক্ষার নামে অকারণে সংঘাতে জড়িও না।"}, {"id": 23, "title_bn": "শক্তি ছড়িয়ে না দিয়ে গুরুত্বপূর্ণ জায়গায় দাও", "title_en": "Concentrate Your Forces", "explanation": "একসাথে দশটি লক্ষ্য ধরলে কোনোটি ভালো হয় না। সবচেয়ে গুরুত্বপূর্ণ ১–২টি বিষয়ে সময় ও শক্তি কেন্দ্রীভূত করো।", "example": "একসাথে পাঁচটি কোর্স না নিয়ে পরীক্ষার জন্য একটি বিষয়ের ওপর ধারাবাহিকভাবে কাজ করা।", "lesson": "Focus মানে বাকি সব চিরতরে বাদ দেওয়া নয়।"}, {"id": 24, "title_bn": "সামাজিক শিষ্টাচার ও কূটনীতি শেখো", "title_en": "Play the Perfect Courtier", "explanation": "কথা বলার ধরন, সময়জ্ঞান, সম্মান দেখানো এবং নিজের আবেগ নিয়ন্ত্রণ—এসব কর্মক্ষেত্র ও সম্পর্কের শক্তি বাড়ায়।", "example": "মিটিংয়ে অন্যের কথা কেটে না দিয়ে নিজের পয়েন্ট সংক্ষেপে বলা।", "lesson": "তোষামোদ নয়; respectful professionalism।"}, {"id": 25, "title_bn": "নিজেকে সচেতনভাবে গড়ে তোলো", "title_en": "Re-Create Yourself", "explanation": "তুমি আজ যেমন, চিরকাল তেমন থাকতে হবে না। অভ্যাস, পোশাক, দক্ষতা, যোগাযোগ ও পরিচয়—সবকিছু উন্নত করা যায়।", "example": "যে বিষয়ে দুর্বল, সেখানে প্রতিদিন ৩০ মিনিট শেখার অভ্যাস তৈরি করা।", "lesson": "ভান করে নতুন মানুষ হওয়ার চেয়ে বাস্তব পরিবর্তন করো।"}, {"id": 26, "title_bn": "নিজের সুনামকে অপ্রয়োজনীয় ঝামেলা থেকে বাঁচাও", "title_en": "Keep Your Hands Clean", "explanation": "ভুল কাজ অন্যের ঘাড়ে চাপানো নয়; বরং দায়িত্ব পরিষ্কার রাখা, নথি রাখা এবং অপ্রয়োজনীয় কেলেঙ্কারি এড়িয়ে চলা।", "example": "কাজ ভাগ করার সময় দায়িত্ব লিখিতভাবে পরিষ্কার করা।", "lesson": "দোষ লুকানো নয়—স্বচ্ছতা ও accountability।"}, {"id": 27, "title_bn": "মানুষের বিশ্বাসের প্রয়োজনকে বুঝো", "title_en": "Play on People’s Need to Believe to Create a Cultlike Following", "explanation": "মানুষ অর্থ, আশা ও কোনো বড় উদ্দেশ্যের সঙ্গে যুক্ত হতে চায়। নেতৃত্বে এটি ইতিবাচকভাবে ব্যবহার করে একটি পরিষ্কার vision দেওয়া যায়; অন্ধ অনুসরণ তৈরি করা উচিত নয়।", "example": "টিমকে শুধু ‘কাজ করো’ না বলে কেন কাজটি গুরুত্বপূর্ণ তা বোঝানো।", "lesson": "ব্যক্তিপূজা, অন্ধ বিশ্বাস ও manipulation থেকে দূরে থাকো।"}, {"id": 28, "title_bn": "সিদ্ধান্ত নিলে আত্মবিশ্বাসের সঙ্গে কাজ করো", "title_en": "Enter Action with Boldness", "explanation": "অতিরিক্ত দ্বিধা সুযোগ নষ্ট করে। তথ্য যথেষ্ট হলে পরিকল্পনা করে দৃঢ়ভাবে শুরু করো।", "example": "নতুন কাজ শেখার সিদ্ধান্ত নিয়ে প্রথম ছোট পদক্ষেপটি আজই নেওয়া।", "lesson": "Boldness ≠ reckless risk।"}, {"id": 29, "title_bn": "শেষ ফলাফল মাথায় রেখে পরিকল্পনা করো", "title_en": "Plan All the Way to the End", "explanation": "শুধু শুরু কীভাবে করবে তা নয়, মাঝপথের সমস্যা ও শেষ ফল কী হবে সেটাও আগে ভাবা দরকার।", "example": "পরীক্ষার পড়ায় শুধু আজ কী পড়বে নয়—সিলেবাস, revision ও mock test-এর পুরো পরিকল্পনা করা।", "lesson": "পরিকল্পনা বদলাতে হলে বাস্তবতার সঙ্গে বদলাও।"}, {"id": 30, "title_bn": "প্রস্তুতি গোপন রাখতে পারো, ফলাফল পরিষ্কার রাখো", "title_en": "Make Your Accomplishments Seem Effortless", "explanation": "দক্ষ মানুষকে অনেক সময় স্বাভাবিক ও effortless মনে হয়, কারণ কঠিন প্রস্তুতি আগে করা থাকে। নিজের পরিশ্রম নিয়ে অহংকার না করে ফলাফলকে কথা বলতে দাও।", "example": "Presentation-এর আগে বহুবার practice করে মঞ্চে শান্তভাবে দেওয়া।", "lesson": "কঠিন কাজকে সহজ দেখানো মানে অন্যের অবদান অস্বীকার করা নয়।"}, {"id": 31, "title_bn": "বিকল্প এমনভাবে সাজাও যাতে সিদ্ধান্তের কাঠামো পরিষ্কার থাকে", "title_en": "Control the Options: Get Others to Play with the Cards You Deal", "explanation": "সব অপশন না ছড়িয়ে ২–৩টি বাস্তবসম্মত বিকল্প দিলে সিদ্ধান্ত সহজ হয়। তবে ইচ্ছাকৃতভাবে মানুষকে ফাঁদে ফেলা নয়।", "example": "ক্লায়েন্টকে ‘এই তিনটি প্যাকেজের কোনটি আপনার জন্য ভালো?’ বলা।", "lesson": "বিকল্প যেন সত্যিই ন্যায্য ও বাস্তব হয়।"}, {"id": 32, "title_bn": "মানুষের আশা ও কল্পনার ভাষা বোঝো", "title_en": "Play to People’s Fantasies", "explanation": "শুধু তথ্য নয়, মানুষ কেন কিছু চায়—সেই আবেগও বোঝা দরকার। ভালো যোগাযোগে vision ও বাস্তব ফল দুটোই থাকে।", "example": "একটি পণ্যের ফিচার বলার পাশাপাশি সেটি কী সমস্যা সমাধান করবে তা বোঝানো।", "lesson": "মিথ্যা স্বপ্ন বিক্রি কোরো না।"}, {"id": 33, "title_bn": "প্রত্যেক মানুষের গুরুত্বপূর্ণ চালিকা শক্তি বুঝে নাও", "title_en": "Discover Each Man’s Thumbscrew", "explanation": "কারও কাছে সম্মান, কারও কাছে নিরাপত্তা, কারও কাছে স্বাধীনতা বা স্বীকৃতি গুরুত্বপূর্ণ। এগুলো বুঝলে যোগাযোগ কার্যকর হয়।", "example": "সহকর্মীকে দায়িত্ব দেওয়ার সময় তার আগ্রহের জায়গার সঙ্গে কাজ মিলিয়ে দেওয়া।", "lesson": "দুর্বলতা খুঁজে শোষণ নয়; motivation বোঝা।"}, {"id": 34, "title_bn": "নিজেকে সম্মান দিলে অন্যরাও সম্মান শেখে", "title_en": "Be Royal in Your Own Fashion: Act Like a King to Be Treated Like One", "explanation": "নিজের সময়, কথা ও সীমার মূল্য নিজেই ঠিক করো। অতিরিক্ত আত্মঅবমূল্যায়ন মানুষকে ভুল সংকেত দিতে পারে।", "example": "অন্যায় কাজের অনুরোধে শান্তভাবে ‘না’ বলা।", "lesson": "অহংকার নয়; self-respect।"}, {"id": 35, "title_bn": "সময়জ্ঞান একটি শক্তি", "title_en": "Master the Art of Timing", "explanation": "সঠিক সিদ্ধান্ত ভুল সময়ে নিলে ফল খারাপ হতে পারে। কখন অপেক্ষা করতে হবে এবং কখন দ্রুত পদক্ষেপ নিতে হবে—এটা শেখো।", "example": "রাগের মুহূর্তে গুরুত্বপূর্ণ মেসেজ না পাঠিয়ে শান্ত হওয়ার পর উত্তর দেওয়া।", "lesson": "Timing-এর সঙ্গে বাস্তব তথ্যও জরুরি।"}, {"id": 36, "title_bn": "যা নিয়ন্ত্রণে নেই, তার পেছনে অতিরিক্ত শক্তি নষ্ট কোরো না", "title_en": "Disdain Things You Cannot Have: Ignoring Them Is the Best Revenge", "explanation": "সবকিছু পাওয়া সম্ভব নয়। কিছু জিনিসকে ছেড়ে এগিয়ে যাওয়া মানসিক শক্তি বাঁচায়।", "example": "কেউ ইচ্ছা করে তোমাকে ignore করলে বারবার attention না চেয়ে নিজের কাজে ফিরে যাওয়া।", "lesson": "অন্যায়কে উপেক্ষা নয়—যেখানে boundary দরকার সেখানে দাও।"}, {"id": 37, "title_bn": "ভালো উপস্থাপনাকে গুরুত্ব দাও", "title_en": "Create Compelling Spectacles", "explanation": "মানুষ দৃশ্যমান উদাহরণ ও memorable presentation বেশি মনে রাখে। তাই কাজের quality-এর পাশাপাশি presentation-ও ভালো করো।", "example": "ডেটা শুধু টেবিলে না দিয়ে পরিষ্কার chart ও উদাহরণসহ উপস্থাপন করা।", "lesson": "দেখনদারি যেন বাস্তব মানের বিকল্প না হয়।"}, {"id": 38, "title_bn": "নিজের চিন্তা রাখো, সামাজিক বুদ্ধি ব্যবহার করো", "title_en": "Think as You Like but Behave Like Others", "explanation": "সব সত্য কথা সব জায়গায় একইভাবে বলা যায় না। পরিবেশ ও সংস্কৃতি বুঝে আচরণ করা সামাজিক দক্ষতা।", "example": "অফিসের formal meeting-এ casual বন্ধুর মতো আচরণ না করা।", "lesson": "নিজস্ব মূল্যবোধ হারিয়ে শুধু সবাইকে খুশি করার চেষ্টা কোরো না।"}, {"id": 39, "title_bn": "অন্যের আবেগে উত্তেজিত না হয়ে স্থির থাকো", "title_en": "Stir Up Waters to Catch Fish", "explanation": "এই Law অন্যের আবেগ উসকে সুবিধা নেওয়ার কথা বলে। নিরাপদ শিক্ষা হলো—নিজের আবেগ নিয়ন্ত্রণ করো এবং কেউ ইচ্ছা করে উত্তেজিত করলে তাতে তাড়াহুড়ো করে প্রতিক্রিয়া দিও না।", "example": "কেউ রাগিয়ে সিদ্ধান্ত নিতে বাধ্য করতে চাইলে বলা—‘আমি একটু সময় নিয়ে উত্তর দেব।’", "lesson": "ইচ্ছা করে কাউকে provoke করা এড়িয়ে চলো।"}, {"id": 40, "title_bn": "ফ্রি জিনিসের লুকানো মূল্য বুঝে নাও", "title_en": "Despise the Free Lunch", "explanation": "কিছু ‘ফ্রি’ অফারের পেছনে শর্ত, ডেটা, সময় বা ভবিষ্যৎ খরচ থাকতে পারে। মূল্য ও শর্ত বুঝে সিদ্ধান্ত নাও।", "example": "ফ্রি অ্যাপ ইনস্টল করার আগে কী permission চাইছে তা দেখা।", "lesson": "সব ফ্রি জিনিস খারাপ নয়; শুধু সচেতন হও।"}, {"id": 41, "title_bn": "অন্যের কপি না হয়ে নিজের পরিচয় তৈরি করো", "title_en": "Avoid Stepping into a Great Man’s Shoes", "explanation": "বড় কারও উত্তরসূরি হলে তার মতো হতে গিয়ে নিজের শক্তি হারানো সহজ। তার ভালো দিক শিখে নিজের style তৈরি করো।", "example": "প্রিয় শিক্ষক বা সিনিয়রের পদ্ধতি শেখা, কিন্তু নিজের কাজের ধরন তৈরি করা।", "lesson": "তুলনা নয়—নিজস্ব উন্নতি।"}, {"id": 42, "title_bn": "সমস্যার কেন্দ্রীয় কারণ খুঁজে সমাধান করো", "title_en": "Strike the Shepherd and the Sheep Will Scatter", "explanation": "একটি সমস্যা যদি একটি নির্দিষ্ট উৎস থেকে বারবার তৈরি হয়, সেই root cause সমাধান করলে পুরো সমস্যার প্রভাব কমে।", "example": "টিমে বারবার একই ভুল হলে শুধু কর্মীকে দোষ না দিয়ে দুর্বল process ঠিক করা।", "lesson": "কাউকে আক্রমণ নয়; root-cause analysis।"}, {"id": 43, "title_bn": "মানুষকে শুধু যুক্তি দিয়ে নয়, সম্মান ও সহমর্মিতা দিয়ে বোঝো", "title_en": "Work on the Hearts and Minds of Others", "explanation": "মানুষের অনুভূতি, প্রয়োজন ও মর্যাদা বুঝলে প্রভাব তৈরি করা সহজ হয়। দীর্ঘমেয়াদি সম্পর্ক জোর করে নয়, trust দিয়ে তৈরি হয়।", "example": "কর্মীর ভুল ধরার আগে তার সমস্যাটা শুনে তারপর সমাধান দেওয়া।", "lesson": "সহমর্মিতা মানে সবকিছু মেনে নেওয়া নয়।"}, {"id": 44, "title_bn": "আয়নার মতো প্রতিফলন মানুষকে নিজের আচরণ বুঝতে সাহায্য করতে পারে", "title_en": "Disarm and Infuriate with the Mirror Effect", "explanation": "কারও আচরণ শান্তভাবে তার সামনে প্রতিফলিত করলে সে নিজের আচরণের প্রভাব দেখতে পারে। এটি প্রতিশোধের জন্য নয়, self-awareness-এর জন্য ব্যবহার করাই ভালো।", "example": "কেউ বারবার বাধা দিলে বলা—‘আমি আপনার কথা শেষ করতে দিই; আপনিও কি আমাকে শেষ করতে দেবেন function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function frame(){document.body.className=s.t;$("#app").innerHTML=`<header><div class=brand onclick=home><b>48 Laws বাংলা</b><small>Power • Strategy • Wisdom</small></div><button onclick=theme>◐</button></header><main id=main></main><nav><button onclick=home>⌂<small>হোম</small></button><button onclick=all>⌕<small>খুঁজুন</small></button><button onclick=favs>★<small>বুকমার্ক</small></button><button onclick=prog>✓<small>প্রগ্রেস</small></button></nav>`}
function card(x){return `<article class=card onclick="openL(${x.id})"><i>${String(x.id).padStart(2,'0')}</i><div><b>${esc(x.title_bn)}</b><small>${esc(x.title_en)}</small><p>${esc(x.explanation.slice(0,90))}…</p></div><strong>${rd(x.id)?'✓':fav(x.id)?'★':'›'}</strong></article>`}
function home(){frame();let p=Math.round(s.r.length/48*100),x=laws.find(x=>!rd(x.id))||laws[0];$("#main").innerHTML=`<section class=hero><em>THE 48 LAWS OF POWER</em><h1>ক্ষমতা বোঝার<br><span>৪৮টি Law</span></h1><p>সহজ বাংলা ব্যাখ্যা, উদাহরণ ও নিজের নোটসহ ব্যক্তিগত reading companion.</p><button class=primary onclick="openL(${x.id})">▶ Continue Reading</button></section><section class=stats><div><b>${s.r.length}</b><small>পড়া হয়েছে</small></div><div><b>${48-s.r.length}</b><small>বাকি</small></div><div><b>${p}%</b><small>প্রগ্রেস</small></div></section><section><h2>আজকের Law</h2>${card(laws[new Date().getDate()%48])}</section><section><h2>সব Law</h2>${laws.slice(0,6).map(card).join('')}<button class=wide onclick=all>৪৮টি Law দেখুন</button></section>`}

function openL(id){frame();let x=laws.find(a=>a.id===id);$("#main").innerHTML=`<article class=reader><div class=rhead><button onclick=home>‹</button><div><em>LAW ${String(id).padStart(2,'0')}</em><h1>${esc(x.title_bn)}</h1><small>${esc(x.title_en)}</small></div><button onclick="toggleF(${id})">${fav(id)?'★':'☆'}</button></div><div class=paper><h3>💡 ব্যাখ্যা</h3><p>${esc(x.explanation)}</p><h3>🎯 উদাহরণ</h3><p>${esc(x.example)}</p><h3>🧠 মনে রাখবে</h3><p class=lesson>${esc(x.lesson)}</p><h3>📝 আমার নোট</h3><textarea id=note placeholder="নিজের কথা লিখো…">${esc(s.n[id]||'')}</textarea><button class=save onclick="note(${id})">নোট সেভ করুন</button></div><div class=actions><button onclick="read(${id})">${rd(id)?'✓ পড়া হয়েছে':'✓ Mark as Read'}</button><button onclick="openL(${Math.min(48,id+1)})">পরের Law →</button></div></article>`}
